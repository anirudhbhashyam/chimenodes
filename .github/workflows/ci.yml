name: ci
on: [push, pull_request]
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11"]
        exclude:
          # ubuntu-latest (26.04) has no CPython 3.9 build for setup-python
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest numpy ruff
      - run: ruff check src tests scripts
        continue-on-error: true
      - run: python -m pytest tests/unit -q
  gl:
    # GL tests skip cleanly when ChimeraX / an OpenGL context is unavailable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest numpy
      - run: python -m pytest tests/gl -q -rs
